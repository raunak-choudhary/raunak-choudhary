# Place this file at: .github/workflows/snake.yml
# It generates the contribution-snake SVGs (light + dark) and pushes them
# to an "output" branch, which the README then displays. Uses the built-in
# GITHUB_TOKEN, so no personal access token is needed.

name: Generate Snake Animation

on:
  schedule:
    # Regenerates once a day so the snake stays current.
    - cron: "0 */24 * * *"
  workflow_dispatch:   # lets you run it manually from the Actions tab
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
